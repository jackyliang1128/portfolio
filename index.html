<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jacky Liang is a UBC computer science student and full-stack developer building production web platforms, automated testing systems, and applied software projects."
    />
    <script>
      ;(() => {
        const portfolioTheme = localStorage.getItem('jacky-portfolio-theme')
        const resolvedTheme =
          portfolioTheme === 'light' || portfolioTheme === 'dark'
            ? portfolioTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'

        document.documentElement.dataset.theme = resolvedTheme
        document.documentElement.style.colorScheme = resolvedTheme
      })()
    </script>
    <title>Jacky Liang | Full-Stack Developer Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
